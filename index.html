<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#061b1d" />
  <title>PR-Explorer Madeira V5</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/brand/app-icon-v5.png" />
  <link rel="preload" as="image" href="assets/brand/intro-madeira-2026.png" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <div id="splash" class="splash" aria-hidden="true">
    <img src="assets/brand/intro-madeira-2026.png" alt="" />
  </div>
  <div id="app" class="app">
    <div id="map" class="map" aria-label="Madeira Karte"></div>
    <header id="topbar" class="topbar"></header>
    <main id="view" class="view"></main>
    <aside id="detailHost" class="detail-host" hidden></aside>
    <nav id="nav" class="nav" aria-label="Hauptnavigation"></nav>
    <div id="toast" class="toast" hidden></div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="src/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(error => {
          console.warn('PRX service worker registration failed', error);
        });
      });
    }
  </script>
</body>
</html>
